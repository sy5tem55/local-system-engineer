<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goethe — Knowledge Graph</title>
<style>
  :root{
    --bg:#0b1020; --panel:#111a30; --line:#22304f; --txt:#d7e1ff;
    --dim:#8296c4; --accent:#4da3ff; --warn:#ffb454; --ok:#39d98a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:12px}
  header input{background:#0d1428;border:1px solid var(--line);color:var(--txt);
               border-radius:6px;padding:5px 9px;width:220px;font-size:12px}
  header button{background:var(--accent);border:0;color:#04101f;font-weight:600;
                border-radius:6px;padding:6px 12px;cursor:pointer;font-size:12px}
  header .spacer{flex:1}
  #status{font-size:12px;color:var(--dim)}
  #status.err{color:var(--warn)}
  #wrap{position:relative;width:100vw;height:calc(100vh - 52px)}
  canvas{display:block;width:100%;height:100%}
  #empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
         flex-direction:column;gap:8px;text-align:center;padding:24px}
  #empty .big{font-size:18px;font-weight:600}
  #empty .small{color:var(--dim);font-size:13px;max-width:520px}
  #tip{position:absolute;pointer-events:none;background:#0d1428ee;border:1px solid var(--line);
       border-radius:6px;padding:6px 9px;font-size:12px;display:none;max-width:340px;z-index:5}
  #legend{position:absolute;left:12px;bottom:12px;background:#0d1428cc;border:1px solid var(--line);
          border-radius:8px;padding:8px 12px;font-size:11px;color:var(--dim);display:none}
  #legend .row{display:flex;align-items:center;gap:6px;margin-top:4px}
  #legend .dot{width:9px;height:9px;border-radius:50%}
</style>
</head>
<body>
<header>
  <h1>Knowledge Graph</h1>
  <span class="sub">lse-graph · Phase 5</span>
  <span class="spacer"></span>
  <span id="status">loading…</span>
  <input id="token" type="password" placeholder="gateway token" autocomplete="off">
  <button id="connect">Connect</button>
</header>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="empty">
    <div class="big" id="empty-title"></div>
    <div class="small" id="empty-body"></div>
  </div>
  <div id="tip"></div>
  <div id="legend"></div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const token = () => localStorage.getItem("goethe_token") || "";
$("token").value = token();
$("connect").onclick = () => { localStorage.setItem("goethe_token", $("token").value.trim()); load(); };
$("token").addEventListener("keydown", e => { if (e.key === "Enter") $("connect").click(); });

const COLORS = {
  node:"#4da3ff", service:"#39d98a", model:"#c792ea", port:"#ffb454",
  person:"#f78c6c", place:"#82d9ff", concept:"#d7e1ff", device:"#7aa2f7",
  credential:"#ff6b9d", unknown:"#5a6b95"
};
const colorFor = t => COLORS[t] || COLORS.unknown;

let nodes = [], edges = [], byId = {}, adj = {}, relColors = {}, relIdx = 0;
let dragNode = null, hoverNode = null, cam = {x:0, y:0, k:1};
const cv = $("cv"), ctx = cv.getContext("2d");

function resize(){
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);

function seedPositions(){
  const R = Math.max(120, 14 * Math.sqrt(nodes.length));
  nodes.forEach((n,i) => {
    const a = (i / Math.max(1,nodes.length)) * Math.PI * 2 + Math.random()*.4;
    n.x = Math.cos(a) * R * (0.6+Math.random()*.5);
    n.y = Math.sin(a) * R * (0.6+Math.random()*.5);
    n.vx = 0; n.vy = 0;
  });
}

function tick(){
  // simple force layout: repulsion + spring edges + centering
  const N = nodes.length;
  for (let i=0;i<N;i++){
    const a = nodes[i];
    a.vx += -a.x * 0.0012; a.vy += -a.y * 0.0012;
    for (let j=i+1;j<N;j++){
      const b = nodes[j];
      let dx = a.x-b.x, dy = a.y-b.y;
      let d2 = dx*dx+dy*dy || 0.01;
      if (d2 > 250000) continue;
      const f = 900 / d2;
      const d = Math.sqrt(d2);
      dx/=d; dy/=d;
      a.vx += dx*f; a.vy += dy*f;
      b.vx -= dx*f; b.vy -= dy*f;
    }
  }
  for (const e of edges){
    const a = byId[e.src], b = byId[e.dst];
    if (!a || !b) continue;
    let dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.sqrt(dx*dx+dy*dy) || 0.01;
    const f = (d - 90) * 0.004;
    dx/=d; dy/=d;
    a.vx += dx*f; a.vy += dy*f;
    b.vx -= dx*f; b.vy -= dy*f;
  }
  for (const n of nodes){
    if (n === dragNode) { n.vx = 0; n.vy = 0; continue; }
    n.vx *= 0.85; n.vy *= 0.85;
    n.x += n.vx; n.y += n.vy;
  }
}

function toScreen(n){ return { x: cv.clientWidth/2 + (n.x - cam.x)*cam.k,
                               y: cv.clientHeight/2 + (n.y - cam.y)*cam.k }; }

function draw(){
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  // edges
  for (const e of edges){
    const a = byId[e.src], b = byId[e.dst];
    if (!a || !b) continue;
    const pa = toScreen(a), pb = toScreen(b);
    ctx.strokeStyle = relColors[e.rel] || "#33415e";
    ctx.globalAlpha = (hoverNode && (e.src===hoverNode.id || e.dst===hoverNode.id)) ? 0.95 : 0.35;
    ctx.lineWidth = (hoverNode && (e.src===hoverNode.id || e.dst===hoverNode.id)) ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
    // arrowhead
    const ang = Math.atan2(pb.y-pa.y, pb.x-pa.x);
    const r = 5*cam.k;
    ctx.beginPath();
    ctx.moveTo(pb.x - Math.cos(ang)*r*2, pb.y - Math.sin(ang)*r*2);
    ctx.lineTo(pb.x - Math.cos(ang+2.6)*r*2.4, pb.y - Math.sin(ang+2.6)*r*2.4);
    ctx.lineTo(pb.x - Math.cos(ang-2.6)*r*2.4, pb.y - Math.sin(ang-2.6)*r*2.4);
    ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // nodes
  for (const n of nodes){
    const p = toScreen(n);
    const r = Math.max(4, (n.type==="node" ? 9 : 7) * cam.k);
    const hot = hoverNode && (n.id===hoverNode.id || (adj[hoverNode.id]||{}).has(n.id));
    ctx.beginPath();
    ctx.arc(p.x, p.y, hot ? r+2 : r, 0, Math.PI*2);
    ctx.fillStyle = colorFor(n.type);
    ctx.globalAlpha = (hoverNode && !hot) ? 0.45 : 1;
    ctx.fill();
    if (hot || cam.k > 0.8){
      ctx.globalAlpha = 1;
      ctx.font = `${Math.max(10, 11*cam.k)}px system-ui`;
      ctx.fillStyle = "#d7e1ff";
      ctx.fillText(n.name, p.x + r + 4, p.y + 4);
    }
  }
  ctx.globalAlpha = 1;
}

function loop(){ tick(); draw(); requestAnimationFrame(loop); }

function hitTest(mx,my){
  for (let i=nodes.length-1;i>=0;i--){
    const n = nodes[i], p = toScreen(n);
    const r = Math.max(6, (n.type==="node"?9:7)*cam.k) + 3;
    if ((mx-p.x)**2 + (my-p.y)**2 < r*r) return n;
  }
  return null;
}

cv.addEventListener("mousemove", ev => {
  const rect = cv.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  if (dragNode){
    dragNode.x = (mx - cv.clientWidth/2)/cam.k + cam.x;
    dragNode.y = (my - cv.clientHeight/2)/cam.k + cam.y;
    return;
  }
  const n = hitTest(mx,my);
  hoverNode = n;
  const tip = $("tip");
  if (n){
    const deg = (adj[n.id]||{}).size;
    tip.style.display = "block";
    tip.style.left = (mx+14)+"px"; tip.style.top = (my+10)+"px";
    tip.innerHTML = `<b>${n.name}</b> <span style="color:${colorFor(n.type)}">●</span> ${n.type} — ${deg} connection${deg===1?"":"s"}<br><span style="color:var(--dim)">doc ${n.id}</span>`;
  } else tip.style.display = "none";
});
cv.addEventListener("mouseleave", () => { hoverNode = null; $("tip").style.display = "none"; });
cv.addEventListener("mousedown", ev => {
  const rect = cv.getBoundingClientRect();
  dragNode = hitTest(ev.clientX-rect.left, ev.clientY-rect.top);
});
window.addEventListener("mouseup", () => dragNode = null);
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const f = ev.deltaY < 0 ? 1.12 : 1/1.12;
  cam.k = Math.min(6, Math.max(0.15, cam.k * f));
}, {passive:false});

function render(data){
  nodes = data.entities.map(e => ({id:e.id, name:e.name, type:e.type}));
  byId = {}; nodes.forEach(n => byId[n.id] = n);
  adj = {};
  edges = [];
  for (const e of data.edges){
    if (!byId[e.src] || !byId[e.dst]) continue; // dst may be a KB doc id, not an entity
    if (!relColors[e.rel]) relColors[e.rel] = `hsl(${(relIdx++*47)%360} 60% 55%)`;
    edges.push(e);
    (adj[e.src] ||= new Set()).add(e.dst);
    (adj[e.dst] ||= new Set()).add(e.src);
  }
  cam = {x:0,y:0,k:1};
  seedPositions();
  const empty = $("empty");
  if (data.dormant || nodes.length === 0){
    empty.style.display = "flex";
    $("empty-title").textContent = data.index_present
      ? "Graph is empty (dormant)" : "Graph index not found";
    $("empty-body").textContent = "lse-graph holds no entities or edges. The Phase 5 layer is " +
      "dormant behind GRAPH_RECALL=0 and only fills from operator-APPLIED proposals via " +
      "materialize_accepted_graph(). This page will render live data automatically once the " +
      "graph is materialized — no reload of the code needed.";
    $("legend").style.display = "none";
    return;
  }
  empty.style.display = "none";
  const types = [...new Set(nodes.map(n=>n.type))].sort();
  $("legend").innerHTML = "<b>node types</b>" + types.map(t =>
    `<div class="row"><span class="dot" style="background:${colorFor(t)}"></span>${t}</div>`).join("");
  $("legend").style.display = "block";
}

async function load(){
  const st = $("status");
  st.className = ""; st.textContent = "loading…";
  try {
    const headers = {};
    if (token()) headers["Authorization"] = "Bearer " + token();
    const r = await fetch("/api/ui/kbgraph", {headers});
    if (r.status === 401){
      st.className = "err";
      st.textContent = "unauthorized — set the gateway token (GOETHE_MCP_TOKEN)";
      return;
    }
    const data = await r.json();
    if (data.error){ st.className = "err"; st.textContent = "error: " + data.error; return; }
    render(data);
    const c = data.counts;
    st.textContent = `${c.entities} entities · ${c.edges} edges` + (data.truncated ? " (truncated)" : "");
    if (!looping){ looping = true; loop(); }
  } catch (e){
    st.className = "err"; st.textContent = "fetch failed: " + e.message;
  }
}
let looping = false;
resize();
load();
</script>
</body>
</html>
