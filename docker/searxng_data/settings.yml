# SearXNG settings — LSE curated engine whitelist (CANONICAL · repo = source of truth)
# Live path: /home/sy5/docker/searxng_data/settings.yml
# Restored from settings.yml.backup-v2-20260603 (27-engine set) + observability merge.
# SELF-REPAIR: scripts/searxng-config-guard.sh (systemd timer) restores THIS file on drift.
# Reddit deliberately excluded — ad-walled, blocks VPS IPs on search.json.
#   For reddit content use "site:reddit.com" via google.
# To change engines: edit keep_only below, commit, deploy. The guard enforces this copy.
use_default_settings:
  engines:
    keep_only:
      # General web
      - google
      - google images
      - google news
      - google scholar
      - duckduckgo
      - duckduckgo images
      - duckduckgo news
      - bing
      - mojeek
      - qwant
      - brave
      # Technical / developer
      - arxiv
      - github
      - stackoverflow
      - askubuntu
      - superuser
      - mdn
      - hackernews
      - pypi
      - npm
      - pkg.go.dev
      - docker hub
      - huggingface
      # Scientific / security
      - pubmed
      - semantic scholar
      - national vulnerability database
      # Reference
      - wikipedia
general:
  enable_metrics: true
  open_metrics: "JZVeoVch20+FvyjXEn4BMVHtu1AM6JCH"
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false            # LSE/Hermes hit the JSON API non-interactively; limiter would 429 them
  secret_key: "913153e683373257077c6b99eebb293055d0784eed80e621cad095921576386b"
search:
  formats:
    - html
    - json
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 180
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 180
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800
engines:
  - name: arxiv
    weight: 4
    timeout: 8.0
    categories: [science, it, technology]
  - name: google
    weight: 3
  - name: google scholar
    weight: 3
    categories: [science, it]
  - name: duckduckgo
    weight: 2
  - name: duckduckgo news
    weight: 2
    categories: [news]
  - name: brave
    weight: 1
  - name: bing
    weight: 1
    disabled: false
  # ── Pinned ON (ship disabled:true in the image; explicit so bumps can't drop them) ──
  - name: mojeek
    weight: 1
    disabled: false
  - name: qwant
    weight: 1
    disabled: false
  - name: hackernews
    weight: 1
    disabled: false
  - name: huggingface
    weight: 1
    disabled: false
  - name: npm
    weight: 1
    disabled: false
  - name: pkg.go.dev
    weight: 1
    disabled: false
  - name: national vulnerability database
    weight: 1
    disabled: false
outgoing:
  request_timeout: 6.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
