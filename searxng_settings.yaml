# SearXNG settings - curated engine whitelist for LSE sysadmin use
# Live path: /home/sy5/docker/searxng_data/settings.yml
#
# Reddit engine REMOVED - Reddit blocks VPS IPs on search.json (returns 0 results)
# Reddit content: use search_web("query site:reddit.com") via Google instead
#
# Engine tiers:
#   Weight 4 - arXiv (science/IT/tech queries)
#   Weight 3 - Google + Google Scholar (primary general/academic)
#   Weight 2 - DuckDuckGo (primary fallback)
#   Weight 1 - everything else (diversity, specialist sources)

use_default_settings:
  engines:
    keep_only:
      # General web
      - google
      - google images
      - google news
      - google scholar
      - duckduckgo
      - duckduckgo images
      - duckduckgo news
      - bing
      - bing news
      - mojeek
      - qwant
      - brave
      - brave.news
      # Technical / developer
      - arxiv
      - github
      - stackoverflow
      - askubuntu
      - superuser
      - mdn
      - hackernews
      - pypi
      - npm
      - pkg.go.dev
      - docker hub
      - huggingface
      # Scientific / security
      - pubmed
      - semantic scholar
      - national vulnerability database
      # Reference
      - wikipedia

server:
  bind_address: "0.0.0.0"
  port: 8088
  limiter: true
  secret_key: "913153e683373257077c6b99eebb293055d0784eed80e621cad095921576386b"

search:
  formats:
    - html
    - json
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 180
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 180
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800

engines:
  - name: arxiv
    weight: 4
    categories: [science, it, technology]

  - name: google
    weight: 3

  - name: google scholar
    weight: 3
    categories: [science, it]

  - name: duckduckgo
    weight: 2

  - name: duckduckgo news
    weight: 2
    categories: [news]

  - name: brave
    weight: 1

outgoing:
  request_timeout: 6.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
