# nginx.conf — Homelab reverse proxy
# Serves: /netobs/ (static), / (Vite) | /api/ DISABLED until FastAPI deployed
#
# PORT REFERENCE (matches .env defaults):
#   FASTAPI_PORT = 8000   → update in upstream block below if different
#   VITE_PORT    = 5173   → same
#   WebSocket topology map (:8765) is direct — browser connects to ws://localhost:8765
#
# host.docker.internal resolves to the WSL2/Windows host from inside the container.
# The extra_hosts entry in docker-compose.yml handles Linux Docker without Docker Desktop.

worker_processes auto;

events {
    worker_connections 512;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 30;

    # Gzip — snapshot.json and JS responses benefit significantly
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/html text/css text/plain
                    application/json application/javascript
                    application/x-javascript text/javascript;

    # Upstreams — change ports here to match your services
    # FastAPI DISABLED — not running. Uncomment upstream + location blocks when deployed.
    # Three FastAPI projects on this host — none on port 8000:
    #   IG Scraper backend:   port 8001  (/home/sy5/projects/ig-scraper/backend/main.py)
    #   Portrait-3D backend:  port 8787  (/home/sy5/projects/portrait-3d/backend/main.py)
    # Set FASTAPI_PORT in .env before enabling, then uncomment below.
    # upstream fastapi {
    #     server host.docker.internal:${FASTAPI_PORT:-8001};   # ← set FASTAPI_PORT in .env
    # }
    upstream vite {
        server host.docker.internal:5173;   # ← VITE_PORT
    }

    server {
        listen 80;
        server_name _;

        # ── Network Topology Map (/netobs/) ───────────────────────────────
        # Static files served directly from the net-discovery directory mount.
        # snapshot.json must not be cached — the map polls it for live data.
        location /netobs/ {
            alias /srv/netobs/;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options nosniff;
        }

        # snapshot.json explicit no-cache (belt-and-suspenders)
        location = /netobs/snapshot.json {
            alias /srv/netobs/snapshot.json;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
        }

        # ── FastAPI backend (/api/) ──────── DISABLED — FastAPI not running ──
        # Uncomment when FastAPI service is confirmed deployed and reachable.
        # location /api/ {
        #     proxy_pass         http://fastapi/;
        #     proxy_http_version 1.1;
        #     proxy_set_header   Host              $host;
        #     proxy_set_header   X-Real-IP         $remote_addr;
        #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        #     proxy_set_header   X-Forwarded-Proto $scheme;
        #     proxy_read_timeout 60s;
        # }

        # FastAPI OpenAPI docs (direct path, not under /api/)
        # location ~ ^/(docs|redoc|openapi\.json) {
        #     proxy_pass http://fastapi;
        # }

        # ── Vite frontend (/) ─────────────────────────────────────────────
        # Dev server: includes WebSocket HMR upgrade support.
        # Production build: swap upstream to serve static dist/ instead.
        location / {
            proxy_pass          http://vite;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_cache_bypass  $http_upgrade;
            proxy_read_timeout  60s;
        }
    }
}
