global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "llama-server"
    static_configs:
      - targets: ["172.17.0.1:8080"]
    metrics_path: "/metrics"
    scrape_interval: 15s

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 15s

  - job_name: "nvidia_gpu"
    static_configs:
      - targets: ["172.17.0.1:9835"]
    scrape_interval: 15s

  - job_name: "llama-context-exporter"
    static_configs:
      - targets: ["172.17.0.1:9836"]
    scrape_interval: 15s

  - job_name: "download-speed"
    static_configs:
      - targets: ["172.17.0.1:9838"]
    scrape_interval: 5s

  - job_name: "llamacpp-slots"
    static_configs:
      - targets: ["172.17.0.1:9839"]
    scrape_interval: 5s

  - job_name: "searxng"
    static_configs:
      - targets: ["searxng:8080"]
    metrics_path: "/metrics"
    basic_auth:
      username: ""
      password: "JZVeoVch20+FvyjXEn4BMVHtu1AM6JCH"
    scrape_interval: 15s

  - job_name: "searxng-error-exporter"
    static_configs:
      - targets: ["searxng-error-exporter:9837"]
    scrape_interval: 15s
